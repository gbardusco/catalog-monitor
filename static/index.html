<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalog Monitor</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1c2230; --mut:#6b7385; --line:#e3e6ec; --acc:#4f46e5; --new:#16a34a; --err:#dc2626; --warn:#b45309; --chip:#eef0f6; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#12151c; --card:#1a1f2b; --fg:#e8eaf0; --mut:#8b93a7; --line:#2a3142; --acc:#818cf8; --new:#4ade80; --err:#f87171; --warn:#fbbf24; --chip:#242b3b; } }
  :root[data-theme="dark"] { --bg:#12151c; --card:#1a1f2b; --fg:#e8eaf0; --mut:#8b93a7; --line:#2a3142; --acc:#818cf8; --new:#4ade80; --err:#f87171; --warn:#fbbf24; --chip:#242b3b; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui,sans-serif; }
  header { padding:10px 20px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; background:var(--card); flex-wrap:wrap; position:sticky; top:0; z-index:5 }
  header h1 { font-size:16px; margin:0; margin-right:auto; white-space:nowrap }
  .page { padding:16px 20px }
  main { display:grid; grid-template-columns:300px minmax(0,1fr); gap:16px; align-items:start; }
  @media (max-width:820px){ main{grid-template-columns:1fr} header { position:static } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; }
  button, select { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:6px; padding:5px 10px; cursor:pointer }
  button:hover { border-color:var(--acc) } button.pri { background:var(--acc); color:#fff; border-color:var(--acc) }
  button:disabled { opacity:.5; cursor:default }
  button.x { padding:0 6px; color:var(--mut); border:none; background:none }
  button.link { border:none; background:none; color:var(--acc); padding:0 }
  input[type=text], input[type=number], input[type=password], input[type=url], input[type=search] { font:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); min-width:0 }
  :focus-visible { outline:2px solid var(--acc); outline-offset:1px }
  .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap } .row.grow input { flex:1 }
  .side { position:sticky; top:62px; max-height:calc(100vh - 78px); display:flex; flex-direction:column; gap:8px }
  @media (max-width:820px){ .side { position:static; max-height:none } #list { max-height:50vh } }
  .side input[type=search], .side select { width:100% }
  #list { overflow-y:auto; min-height:120px; flex:1; margin:0 -4px; padding:0 4px }
  .between { justify-content:space-between }
  .grp { display:flex; justify-content:space-between; align-items:center; gap:6px; padding:4px 6px; margin-top:8px; font-weight:600; font-size:12px; color:var(--mut); cursor:pointer; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--card); user-select:none }
  .grp:hover { color:var(--fg) } .grp .n { font-weight:400 }
  .comp { padding:8px; border-radius:8px; cursor:pointer; border:1px solid transparent; margin-top:6px }
  .comp.sel { border-color:var(--acc); background:color-mix(in srgb,var(--acc) 8%,transparent) }
  .comp b { display:block } .mut { color:var(--mut); font-size:12px }
  .badge { background:var(--new); color:#fff; border-radius:10px; padding:0 7px; font-size:11px; margin-left:6px; white-space:nowrap }
  .badge.gray { background:var(--mut) } .badge.err { background:var(--err) }
  .chip { display:inline-flex; align-items:center; gap:3px; background:var(--chip); border:1px solid var(--line); border-radius:12px; padding:1px 9px; margin:2px 4px 2px 0; font-size:12px }
  .chip.f { border-color:var(--acc); font-weight:600 } .chip.v { border-style:dashed }
  .chip.btn { cursor:pointer } .chip.btn:hover { border-color:var(--acc) }
  .chip.on { background:var(--acc); color:#fff; border-color:var(--acc) }
  .tablewrap { overflow-x:auto }
  table { width:100%; border-collapse:collapse } th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top }
  th { font-size:12px; color:var(--mut); font-weight:600; position:sticky; top:0; background:var(--card); white-space:nowrap }
  th.s { cursor:pointer; user-select:none } th.s:hover { color:var(--fg) }
  tr.new td { background:color-mix(in srgb,var(--new) 10%,transparent) }
  tr.dim td { opacity:.6 } tr.rem td { opacity:.5; text-decoration:line-through }
  .prog { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:5px }
  .prog > i { display:block; height:100%; background:var(--acc); transition:width .4s }
  .prog.ind > i { width:35%; animation:ind 1.1s ease-in-out infinite alternate }
  @keyframes ind { from { margin-left:0 } to { margin-left:65% } }
  .warn { color:var(--warn) } button.warn { border-color:var(--warn) }
  .banner { border:1px solid var(--warn); border-radius:8px; padding:8px 10px; margin:10px 0; display:flex; gap:10px; align-items:center; flex-wrap:wrap }
  .banner .txt { flex:1; min-width:200px }
  .err { color:var(--err) } a { color:var(--acc); text-decoration:none } a:hover { text-decoration:underline }
  h2 { margin:0 0 6px; font-size:18px } h3 { margin:14px 0 6px; font-size:14px }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:10px 0 }
  .pager { display:flex; gap:8px; align-items:center; justify-content:flex-end; margin-top:10px }
  dialog { border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--fg); padding:16px; width:min(560px,92vw) }
  dialog::backdrop { background:rgba(0,0,0,.45) }
  .item { display:flex; gap:8px; align-items:center; padding:4px 0; border-bottom:1px solid var(--line) }
  .item .nm { flex:1; word-break:break-word }
  .end { justify-content:flex-end; margin-top:12px }
  .field { display:grid; grid-template-columns:200px 1fr; gap:8px; align-items:center; margin:6px 0 }
  @media (max-width:600px){ .field { grid-template-columns:1fr } }
  .field input[type=text], .field input[type=password], .field input[type=url], .field input[type=number] { width:100% }
  .toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--fg); color:var(--bg); padding:8px 14px; border-radius:8px; z-index:20; max-width:90vw }
  .kind-credit { background:var(--new) } .kind-artist { background:#0ea5e9 } .kind-title { background:#a855f7 } .kind-none { background:var(--mut) }
  pre.det { margin:0; font:12px/1.4 ui-monospace,monospace; white-space:pre-wrap; color:var(--mut) }
  /* sempre por último: sem isto, regras como main{display:grid} anulam o atributo hidden e as abas não trocam */
  [hidden] { display:none !important }
</style>
</head>
<body>
<header>
  <h1>🎼 Catalog Monitor <span class="mut">— ArrangeMe</span></h1>
  <nav class="row">
    <button id="tabComp" class="pri" data-i18n="tab.composers"></button>
    <button id="tabNew"><span data-i18n="tab.new"></span> <span class="badge" id="newCount" hidden>0</span></button>
    <button id="tabHist" data-i18n="tab.history"></button>
    <button id="tabSet" data-i18n="tab.settings"></button>
  </nav>
  <button id="resumeAll" class="warn" hidden></button>
  <button id="scanAll" data-i18n="scan.all"></button>
  <button id="reloadAll" data-i18n="reload.all" data-i18n-title="reload.all.title"></button>
  <button id="notifBtn" data-i18n-title="notif.title"></button>
  <button id="themeBtn" aria-label="theme">🌓</button>
  <select id="lang" aria-label="Language" title="Language / Idioma / Idioma">
    <option value="pt">Português</option><option value="en">English</option><option value="es">Español</option>
  </select>
</header>

<div class="page">
  <main id="viewComp">
    <aside class="card side">
      <button id="addBtn" class="pri" style="width:100%" data-i18n="add.btn"></button>
      <input type="search" id="sideQ" data-i18n-ph="side.search" data-i18n-aria="side.search" autocomplete="off">
      <select id="sideSort" data-i18n-aria="side.sort">
        <option value="az" data-i18n="sort.az"></option><option value="za" data-i18n="sort.za"></option>
        <option value="activity" data-i18n="sort.activity"></option><option value="records" data-i18n="sort.records"></option>
        <option value="checked" data-i18n="sort.checked"></option><option value="added" data-i18n="sort.added"></option>
      </select>
      <div id="sideFilters"></div>
      <div class="row between">
        <label class="mut" id="sideGroupLbl" data-i18n-title="side.group.tip"><input type="checkbox" id="sideGroup"> <span data-i18n="side.group"></span></label>
        <span><button class="link mut" id="sideCollapse" data-i18n="side.collapse"></button> · <button class="link mut" id="sideExpand" data-i18n="side.expand"></button></span>
      </div>
      <span class="mut" id="sideCount"></span>
      <div id="list"></div>
    </aside>
    <section class="card" id="detail"><span class="mut" data-i18n="detail.empty"></span></section>
  </main>

  <section id="viewNew" class="card" hidden>
    <h2 data-i18n="new.title"></h2>
    <div class="mut" data-i18n="new.desc"></div>
    <div class="tablewrap" id="newBody"></div>
  </section>

  <section id="viewHist" class="card" hidden>
    <h2 data-i18n="hist.title"></h2>
    <div class="mut" data-i18n="hist.desc"></div>
    <div class="tablewrap" id="histBody"></div>
  </section>

  <section id="viewSet" class="card" hidden>
    <h2 data-i18n="set.title"></h2>
    <h3 data-i18n="set.general"></h3>
    <div class="field"><label for="setInterval" data-i18n="set.interval"></label><input type="number" id="setInterval" min="1" max="720"></div>
    <div class="field"><label for="setDelay" data-i18n="set.delay"></label><input type="number" id="setDelay" min="200" max="60000" step="100"></div>
    <h3 data-i18n="set.notify"></h3>
    <p class="mut" data-i18n="set.secrets"></p>
    <div class="field"><label for="setDesktop" data-i18n="set.desktop"></label><input type="checkbox" id="setDesktop"></div>
    <div class="field"><label for="setDiscord">Discord (webhook)</label><div class="row grow"><input type="password" id="setDiscord" autocomplete="off" placeholder="https://discord.com/api/webhooks/…"><button type="button" data-clear="discord" class="x" data-i18n-title="set.clear">✕</button></div></div>
    <div class="field"><label for="setTgToken">Telegram (bot token)</label><div class="row grow"><input type="password" id="setTgToken" autocomplete="off" placeholder="123456:ABC…"><button type="button" data-clear="telegram" class="x" data-i18n-title="set.clear">✕</button></div></div>
    <div class="field"><label for="setTgChat">Telegram (chat id)</label><input type="text" id="setTgChat" autocomplete="off"></div>
    <div class="field"><label for="setNtfy">ntfy (URL do tópico)</label><div class="row grow"><input type="password" id="setNtfy" autocomplete="off" placeholder="https://ntfy.sh/meu-topico"><button type="button" data-clear="ntfy" class="x" data-i18n-title="set.clear">✕</button></div></div>
    <div class="field"><label for="setWebhook" data-i18n="set.webhook"></label><div class="row grow"><input type="password" id="setWebhook" autocomplete="off" placeholder="https://…"><button type="button" data-clear="webhook" class="x" data-i18n-title="set.clear">✕</button></div></div>
    <div class="row end">
      <span id="setStatus" class="mut"></span>
      <button id="setTest" data-i18n="set.test"></button>
      <button id="setSave" class="pri" data-i18n="set.save"></button>
    </div>
    <h3 data-i18n="set.data"></h3>
    <div class="row">
      <a href="/api/export?format=csv" download data-i18n="set.export.csv"></a> ·
      <a href="/api/export?format=json" download data-i18n="set.export.json"></a> ·
      <a href="/feed.xml" target="_blank" rel="noopener" data-i18n="set.feed"></a>
    </div>
  </section>
</div>

<dialog id="dlg">
  <form id="dlgForm" method="dialog">
    <h2 id="dlgTitle"></h2>
    <p class="mut" id="dlgHelp"></p>
    <div id="dlgRows"></div>
    <div class="row grow" style="margin-top:8px">
      <input type="text" id="dlgNew" autocomplete="off" data-i18n-ph="dlg.new.ph">
      <button type="button" id="dlgAdd" data-i18n="dlg.add"></button>
    </div>
    <div class="row end">
      <button type="button" id="dlgCancel" data-i18n="dlg.cancel"></button>
      <button type="submit" class="pri" id="dlgSave"></button>
    </div>
  </form>
</dialog>

const LOCALES = { pt:'pt-BR', en:'en-US', es:'es-ES' };
function detectLang() {
  try { const s = localStorage.getItem('lang'); if (I18N[s]) return s; } catch {}
  const n = (navigator.language || 'en').slice(0, 2).toLowerCase();
  return I18N[n] ? n : 'en';
}
let lang = detectLang();
const t = (k, ...a) => (I18N[lang][k] ?? I18N.en[k] ?? k).replace(/\{(\d+)\}/g, (_, i) => a[i] ?? '');
function applyI18n() {
  document.documentElement.lang = LOCALES[lang];
  document.querySelectorAll('[data-i18n]').forEach(e => e.textContent = t(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(e => e.placeholder = t(e.dataset.i18nPh));
  document.querySelectorAll('[data-i18n-title]').forEach(e => e.title = t(e.dataset.i18nTitle));
  document.querySelectorAll('[data-i18n-aria]').forEach(e => e.setAttribute('aria-label', t(e.dataset.i18nAria)));
  $('#lang').value = lang;
}
// mensagens do histórico chegam como "chave|arg|arg"
function fmtDetail(d) {
  return d.split('\n').filter(Boolean).map(line => {
    const [k, ...a] = line.split('|');
    return I18N.en[k] ? t(k, ...a) : line;
  }).join('\n');
}

const esc = s => (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const loc = () => LOCALES[lang];
const fmt = ts => ts ? new Date(ts * 1000).toLocaleString(loc()) : '';
function ago(ts) {
  if (!ts) return t('never');
  const diff = Math.round((Date.now() / 1000 - ts));
  const rtf = new Intl.RelativeTimeFormat(loc(), { numeric: 'auto' });
  if (diff < 90) return rtf.format(0, 'second');
  if (diff < 5400) return rtf.format(-Math.round(diff / 60), 'minute');
  if (diff < 129600) return rtf.format(-Math.round(diff / 3600), 'hour');
  return rtf.format(-Math.round(diff / 86400), 'day');
}
function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; el.setAttribute('role', 'status');
  document.body.appendChild(el); setTimeout(() => el.remove(), 4000);
}
async function api(path, method = 'GET', body) {
  const r = await fetch('/api' + path, { method, headers: { 'Content-Type': 'application/json' }, body: body !== undefined ? JSON.stringify(body) : undefined });
  if (!r.ok) { const m = await r.text(); toast(I18N.en[m] ? t(m) : m); throw new Error(m); }
  return r.json();
}

/* ---------------- barra de progresso ---------------- */
function progBar(p) {
  if (!p) return '';
  const pct = p.total ? Math.min(100, Math.round(p.done * 100 / p.total)) : 0;
  const label = `${p.steps > 1 ? `${t('prog.name', p.step, p.steps)} · ` : ''}"${esc(p.term)}"${p.total ? ` · ${p.done}/${p.total}` : ''}`;
  return `<div class="prog ${p.total ? '' : 'ind'}" role="progressbar" aria-valuenow="${pct}"><i style="width:${p.total ? pct : 35}%"></i></div><span class="mut">${label}</span>`;
}

const getSeen = () => { try { return +localStorage.getItem('newSeenAt') || 0; } catch { return 0; } };
const setSeen = v => { try { localStorage.setItem('newSeenAt', v); } catch {} };
function markNewSeen() { setSeen(Math.floor(Date.now() / 1000)); updateNewIndicators(); }
function updateNewIndicators() {
  const seenAt = S.view === 'new' ? Math.floor(Date.now() / 1000) : getSeen();
  const n = S.newList.filter(s => s.found_at > seenAt).length;
  $('#newCount').textContent = n; $('#newCount').hidden = !n;

  if (S.lastNewTotal !== null && S.newList.length > S.lastNewTotal && 'Notification' in window && Notification.permission === 'granted') {
    const note = new Notification('Catalog Monitor', { body: t('notif.body', S.newList.length - S.lastNewTotal) });

}

/* ---------------- lista lateral: busca, ordenação, filtros e grupos por inicial ---------------- */
const foldJs = x => (x || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
const initialOf = name => { const ch = foldJs(name)[0] || '#'; return /[a-z]/.test(ch) ? ch.toUpperCase() : '#'; };
const isRecentNew = c => c.last_new_at && Date.now() / 1000 - c.last_new_at < 7 * 86400;
const needsAttention = c => c.incomplete.length > 0 || !!c.last_error;
const byName = (x, y) => x.name.localeCompare(y.name, loc(), { sensitivity: 'base' });

function sideItems() {
  const q = foldJs(S.sideQ);
  let items = S.composers.map(c => {
    if (!q) return { c, via: null };
    if (foldJs(c.name).includes(q)) return { c, via: null };
    const m = c.terms.find(x => foldJs(x.term).includes(q)); // achou por um alias
    return m ? { c, via: m.term } : null;
  }).filter(Boolean);
  if (S.sideFilter === 'new') items = items.filter(i => isRecentNew(i.c));
  if (S.sideFilter === 'pending') items = items.filter(i => needsAttention(i.c));
  const cmp = {
    az: byName, za: (x, y) => byName(y, x),
    activity: (x, y) => (y.last_new_at || 0) - (x.last_new_at || 0) || byName(x, y),
    records: (x, y) => y.total - x.total || byName(x, y),
    checked: (x, y) => (x.last_ok_at || 0) - (y.last_ok_at || 0) || byName(x, y), // nunca verificados primeiro
    added: (x, y) => y.created_at - x.created_at || byName(x, y),
  }[S.sideSort];
  return items.sort((x, y) => cmp(x.c, y.c));
}
function itemHtml({ c, via }) {
  return `<div class="comp ${c.id === S.selected ? 'sel' : ''}" data-id="${c.id}" tabindex="0" role="button">
      <b>${esc(c.name)}${isRecentNew(c) ? `<span class="badge">${t('badge.new')}</span>` : ''}${needsAttention(c) && !c.scanning ? ` <span class="warn mut" title="${esc(t('incomplete.title'))}">⚠</span>` : ''}</b>
      ${via ? `<span class="mut">↳ ${esc(via)}</span><br>` : ''}
      <span class="mut">${t('comp.records', c.total)} · ${c.scanning ? t('comp.scanning') : t('comp.checked', ago(c.last_ok_at))}</span>${progBar(c.scanning)}
      ${c.last_error ? `<div class="err mut">${esc(c.last_error)}</div>` : ''}
    </div>`;
}
function renderSideControls() {
  const f = ['all', 'new', 'pending'];
  $('#sideFilters').innerHTML = f.map(k => `<span class="chip btn ${S.sideFilter === k ? 'on' : ''}" data-filter="${k}" role="button" tabindex="0">${t('filter.' + k)}</span>`).join('');
  $('#sideSort').value = S.sideSort;
  const nameSort = S.sideSort === 'az' || S.sideSort === 'za';
  $('#sideGroup').checked = S.sideGroup; $('#sideGroup').disabled = !nameSort;
  $('#sideGroupLbl').style.opacity = nameSort ? 1 : .5;
  $('#sideCollapse').hidden = $('#sideExpand').hidden = !(nameSort && S.sideGroup);
}
function renderList() {
  renderSideControls();
  const items = sideItems();
  const searching = !!foldJs(S.sideQ);
  const grouped = S.sideGroup && (S.sideSort === 'az' || S.sideSort === 'za');
  $('#sideCount').textContent = t('side.count', items.length, S.composers.length);
  let html;
  if (!items.length) html = `<p class="mut">${S.composers.length ? t('side.none') : t('list.empty')}</p>`;
  else if (!grouped) html = items.map(itemHtml).join('');
  else {
    const groups = new Map();
    for (const it of items) { const g = initialOf(it.c.name); if (!groups.has(g)) groups.set(g, []); groups.get(g).push(it); }
    html = [...groups].map(([g, list]) => {
      const closed = !searching && S.collapsed.has(g);
      // grupo recolhido ainda mostra o compositor selecionado, para você não se perder
      const shown = closed ? list.filter(i => i.c.id === S.selected) : list;
      return `<div class="grp" data-grp="${g}" role="button" tabindex="0" aria-expanded="${!closed}"><span>${closed ? '▸' : '▾'} ${g}</span><span class="n">${list.length}</span></div>${shown.map(itemHtml).join('')}`;
    }).join('');
  }
  $('#list').innerHTML = html;
  const pending = S.composers.filter(c => c.incomplete.length && !c.scanning).length;
  const busy = S.composers.some(c => c.scanning);
  $('#resumeAll').hidden = !pending || busy;
  $('#resumeAll').textContent = `${t('resume.all')} (${pending})`;
}
function toggleGroup(g) { if (S.collapsed.has(g)) S.collapsed.delete(g); else S.collapsed.add(g); saveSide(); renderList(); }
$('#list').onclick = e => {
  const grp = e.target.closest('.grp'); if (grp) return toggleGroup(grp.dataset.grp);
  const el = e.target.closest('.comp'); if (el) select(+el.dataset.id);
};
$('#list').onkeydown = e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const grp = e.target.closest('.grp'); if (grp) { e.preventDefault(); return toggleGroup(grp.dataset.grp); }
  const el = e.target.closest('.comp'); if (el) { e.preventDefault(); select(+el.dataset.id); }
};
$('#sideQ').addEventListener('input', e => { S.sideQ = e.target.value; renderList(); });
$('#sideQ').addEventListener('keydown', e => { if (e.key === 'Escape') { e.target.value = ''; S.sideQ = ''; renderList(); } });
$('#sideSort').onchange = e => { S.sideSort = e.target.value; saveSide(); renderList(); };
$('#sideGroup').onchange = e => { S.sideGroup = e.target.checked; saveSide(); renderList(); };
$('#sideFilters').addEventListener('click', e => { const c = e.target.closest('[data-filter]'); if (c) { S.sideFilter = c.dataset.filter; saveSide(); renderList(); } });
$('#sideCollapse').onclick = () => { S.collapsed = new Set(S.composers.map(c => initialOf(c.name))); saveSide(); renderList(); };
$('#sideExpand').onclick = () => { S.collapsed.clear(); saveSide(); renderList(); };
// "/" foca a busca de compositores (fora de campos de texto)
document.addEventListener('keydown', e => {
  if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) && !dlg.open) { e.preventDefault(); setView('comp'); $('#sideQ').focus(); }
});

function select(id) {
  S.selected = id; S.page = 1; S.q = ''; S.withId = null; S.detailSig = null; connSig = '';
  setView('comp'); renderList(); buildDetail();
}

/* ---------------- detalhe: cabeçalho (sem campos de texto, seguro para re-renderizar) ---------------- */
function buildDetail() {
  const c = sel();
  if (!c) { $('#detail').innerHTML = `<span class="mut">${t('detail.empty')}</span>`; return; }
  const others = S.composers.filter(o => o.id !== c.id);
  $('#detail').innerHTML = `
    <div id="dHead"></div>
    <div class="bar">
      <input type="search" id="fQ" placeholder="${esc(t('f.search'))}" value="${esc(S.q)}" style="flex:1;min-width:200px" aria-label="${esc(t('f.search'))}">
      <span id="fKinds"></span>
      <label><input type="checkbox" id="fNew" ${S.onlyNew ? 'checked' : ''}> ${t('f.new')}</label>
      <label><input type="checkbox" id="fRem" ${S.hideRemoved ? 'checked' : ''}> ${t('f.hideRemoved')}</label>
    </div>
    <div id="fWith"></div>
    <div class="tablewrap" id="dTable"></div>
    <div class="pager" id="dPager"></div>
    <details id="dConn" open><summary><b>${t('conn.title')}</b></summary><div id="dConnBody"></div></details>
    ${others.length ? `<div class="bar"><select id="mergeSel"><option value="">${esc(t('btn.merge'))}</option>${others.map(o => `<option value="${o.id}">${esc(o.name)}</option>`).join('')}</select></div>` : ''}`;
  renderKinds(); renderHead(); loadSongs(); loadConnections();
}
function renderKinds() {
  const el = $('#fKinds'); if (!el) return;
  el.innerHTML = ['credit', 'artist', 'title', 'none', 'all'].map(k =>
    `<span class="chip btn ${S.kind === k ? 'on' : ''}" data-kind="${k}" ${k === 'all' ? '' : `title="${esc(t('kind.' + k + '.tip'))}"`} role="button" tabindex="0">${t('kind.' + k)}</span>`).join('');
}
function renderHead() {
  const c = sel(); const el = $('#dHead'); if (!c || !el) return;
  const sig = JSON.stringify([c.name, c.terms, c.incomplete, c.scanning, c.total, c.last_ok_at, c.last_error, lang, S.intervalHours]);
  if (sig === S.detailSig) return; S.detailSig = sig;
  const x = id => `/api/composers/${id}/export`;
  el.innerHTML = `
    <div class="row"><h2 style="margin:0;flex:1">⭐ ${esc(c.name)}</h2>
      <button data-act="edit">${t('btn.edit')}</button>
      <button data-act="scan" ${c.scanning ? 'disabled' : ''}>${t('btn.scan')}</button>
      <button data-act="reload" ${c.scanning ? 'disabled' : ''} title="${esc(t('reload.title'))}">${t('btn.reload')}</button>
      <a href="${x(c.id)}?format=csv" download>${t('export.csv')}</a> · <a href="${x(c.id)}?format=json" download>${t('export.json')}</a>
      <button data-act="del" class="err">${t('btn.delete')}</button></div>
    <div style="margin-top:6px">${c.terms.map(m => `<span class="chip ${m.primary ? 'f' : ''} ${m.searchable ? '' : 'v'}" ${m.searchable ? '' : `title="${esc(t('term.visual.title'))}"`}>${m.primary ? '⭐ ' : ''}${esc(m.term)}${m.searchable ? '' : ` <span class="mut">👁 ${t('term.visual')}</span>`}</span>`).join('')}</div>
    ${progBar(c.scanning)}
    ${c.incomplete.length && !c.scanning ? `<div class="banner warn"><div class="txt"><b>${t('incomplete.title')}</b><br><span class="mut">${c.incomplete.map(i => esc(i.term) + ' — ' + (i.initial ? t('incomplete.initial', i.loaded, i.total) : t('incomplete.interrupted'))).join(' · ')}</span></div><button data-act="resume" class="pri">${t('resume.btn')}</button></div>` : ''}
    ${c.last_error ? `<div class="err mut">${esc(c.last_error)}</div>` : ''}`;
}

/* ---------------- detalhe: tabela, paginação, conexões ---------------- */
let songsSeq = 0;
async function loadSongs() {
  const c = sel(); if (!c || !$('#dTable')) return;
  const seq = ++songsSeq;
  const p = new URLSearchParams({ q: S.q, kind: S.kind, new: S.onlyNew ? 1 : 0, hide_removed: S.hideRemoved ? 1 : 0, sort: S.sort, dir: S.dir, page: S.page, limit: S.limit });
  if (S.withId) p.set('with', S.withId);
  const d = await api(`/composers/${c.id}/songs?${p}`);
  if (seq !== songsSeq || !$('#dTable')) return; // resposta antiga
  const pages = Math.max(1, Math.ceil(d.total / d.limit));
  if (S.page > pages) { S.page = pages; return loadSongs(); }
  const arrow = k => S.sort === k ? (S.dir === 'asc' ? ' ▲' : ' ▼') : '';
  const recent = s => s.is_new && Date.now() / 1000 - s.found_at < 7 * 86400;
  $('#dTable').innerHTML = d.items.length ? `<table><thead><tr>
      <th class="s" data-sort="date">${t('col.added')}${arrow('date')}</th><th class="s" data-sort="title">${t('col.title')}${arrow('title')}</th>
      <th>${t('col.credits')}</th><th>${t('col.artist')}</th><th class="s" data-sort="kind">${t('col.match')}${arrow('kind')}</th><th class="s" data-sort="uploads">${t('col.uploads')}${arrow('uploads')}</th></tr></thead><tbody>` +
    d.items.map(s => `<tr class="${recent(s) ? 'new' : ''} ${s.kind === 'credit' ? '' : 'dim'} ${s.removed ? 'rem' : ''}">
      <td>${esc(s.date_added)}</td>
      <td><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>${recent(s) ? `<span class="badge">${t('badge.new')}</span>` : ''}${s.removed ? `<span class="badge gray">${t('badge.removed')}</span>` : ''}
        ${s.also.map(a => `<a href="#" class="chip btn" data-goto="${a.id}" title="${esc(a.name)}">↔ ${esc(a.name)}</a>`).join('')}</td>
      <td>${creditsHtml(s.credit_links, c.id)}</td><td>${esc([s.artist, s.show].filter(Boolean).join(' / '))}</td><td>${kindBadge(s.kind)}</td><td>${s.uploads}</td></tr>`).join('') +
    '</tbody></table>' : `<p class="mut">${t('empty.table')}</p>`;
  const sum = `${t('summary', d.total, ago(c.last_ok_at), S.intervalHours)}`;
  $('#dPager').innerHTML = `<span class="mut" style="margin-right:auto">${sum}</span>
    <select id="pSize" aria-label="${esc(t('pager.size'))}">${[50, 100, 200, 500].map(n => `<option value="${n}" ${n === S.limit ? 'selected' : ''}>${n} ${t('pager.size')}</option>`).join('')}</select>
    <button data-page="${S.page - 1}" ${S.page <= 1 ? 'disabled' : ''}>${t('pager.prev')}</button>
    <span>${t('pager.info', S.page, pages)}</span>
    <button data-page="${S.page + 1}" ${S.page >= pages ? 'disabled' : ''}>${t('pager.next')}</button>`;
  const w = $('#fWith');
  if (w) w.innerHTML = S.withId ? `<span class="chip on">${esc(t('conn.with', sel_name(S.withId)))} <button class="x" data-act="clearwith" style="color:#fff">✕</button></span>` : '';
}
let connSig = '';
async function loadConnections() {
  const c = sel(); if (!c || !$('#dConnBody')) return;
  const d = await api(`/composers/${c.id}/connections`);
  const sig = JSON.stringify([d, lang, S.withId]); if (sig === connSig && $('#dConnBody').innerHTML) return; connSig = sig;
  $('#dConnBody').innerHTML = (d.shared.length || d.cowriters.length) ? `
    ${d.shared.length ? `<div class="mut">${t('conn.shared')}</div>${d.shared.map(s => `<span class="chip btn ${S.withId === s.composer_id ? 'on' : ''}" data-with="${s.composer_id}" role="button" tabindex="0">${esc(s.name)} <b>×${s.count}</b></span>`).join('')}` : ''}
    ${d.cowriters.length ? `<div class="mut" style="margin-top:6px">${t('conn.cowriters')}</div>${d.cowriters.map(w => `<span class="chip">${esc(w.name)} <b>×${w.count}</b> <button class="link" data-monitor="${esc(w.name)}">${t('conn.monitor')}</button></span>`).join('')}` : ''}`
    : `<span class="mut">${t('conn.none')}</span>`;
}

$('#detail').addEventListener('input', e => {
  if (e.target.id === 'fQ') { clearTimeout(S.qTimer); S.qTimer = setTimeout(() => { S.q = e.target.value; S.page = 1; loadSongs(); }, 250); }
});
$('#detail').addEventListener('change', async e => {
  const el = e.target;
  if (el.id === 'fNew') { S.onlyNew = el.checked; S.page = 1; loadSongs(); }
  else if (el.id === 'fRem') { S.hideRemoved = el.checked; S.page = 1; loadSongs(); }
  else if (el.id === 'pSize') { S.limit = +el.value; S.page = 1; loadSongs(); }
  else if (el.id === 'mergeSel' && el.value) {
    const into = +el.value, target = S.composers.find(c => c.id === into);
    if (confirm(t('confirm.merge', target.name))) { await api(`/composers/${S.selected}/merge`, 'POST', { into }); S.selected = into; S.detailSig = null; await refresh(); buildDetail(); }
    else el.value = '';
  }
});
$('#detail').addEventListener('click', async e => {
  const el = e.target.closest('[data-act],[data-sort],[data-kind],[data-page],[data-with],[data-monitor],[data-goto]'); if (!el) return;
  const id = S.selected, d = el.dataset;
  if (d.goto) { e.preventDefault(); select(+d.goto); }
  else if (d.sort) { if (S.sort === d.sort) S.dir = S.dir === 'asc' ? 'desc' : 'asc'; else { S.sort = d.sort; S.dir = d.sort === 'title' ? 'asc' : 'desc'; } S.page = 1; loadSongs(); }
  else if (d.kind) { S.kind = d.kind; S.page = 1; renderKinds(); loadSongs(); }
  else if (d.page) { S.page = +d.page; loadSongs(); }
  else if (d.with) { S.withId = S.withId === +d.with ? null : +d.with; S.page = 1; connSig = ''; loadConnections(); loadSongs(); }
  else if (d.monitor) openDialog('create', d.monitor);
  else if (d.act === 'clearwith') { S.withId = null; S.page = 1; connSig = ''; loadConnections(); loadSongs(); }
  else if (d.act === 'edit') openDialog('edit');
  else if (d.act === 'scan' || d.act === 'resume') await act(`/composers/${id}/scan`, d.act === 'scan' ? 'toast.scan' : 'toast.resume');
  else if (d.act === 'reload') { if (confirm(t('confirm.reload'))) await act(`/composers/${id}/scan?full=1`, 'toast.reload'); }
  else if (d.act === 'del') { if (confirm(t('confirm.delete'))) { await api('/composers/' + id, 'DELETE'); S.selected = null; await refresh(); buildDetail(); } }
});
$('#newBody').addEventListener('click', e => { const a = e.target.closest('[data-goto]'); if (a) { e.preventDefault(); select(+a.dataset.goto); } });

/* ---------------- popup de cadastro/edição ---------------- */
const dlg = $('#dlg');
const D = { mode: 'create', rows: [], featured: 0 }; // create: linhas locais; edit: reflete o servidor
function openDialog(mode, prefill = '') {
  D.mode = mode;
  if (mode === 'create') { D.rows = prefill ? [{ term: prefill, visual: false }] : []; D.featured = 0; }
  $('#dlgTitle').textContent = t(mode === 'create' ? 'dlg.create' : 'dlg.edit');
  $('#dlgHelp').textContent = t('dlg.help');
  $('#dlgSave').textContent = t(mode === 'create' ? 'dlg.save' : 'dlg.close');
  $('#dlgCancel').hidden = mode === 'edit';
  $('#dlgNew').value = '';
  renderDlgRows(); dlg.showModal(); $('#dlgNew').focus();
}
function dlgRows() {
  if (D.mode === 'edit') { const c = sel(); return c ? c.terms.map(m => ({ id: m.id, term: m.term, visual: !m.searchable, featured: m.primary })) : []; }
  return D.rows.map((r, i) => ({ idx: i, term: r.term, visual: r.visual, featured: i === D.featured }));
}
function renderDlgRows() {
  $('#dlgRows').innerHTML = dlgRows().map(r => `
    <div class="item">
      <input type="radio" name="feat" ${r.featured ? 'checked' : ''} data-feat="${r.id ?? r.idx}" aria-label="${esc(t('dlg.featured'))}" title="${esc(t('dlg.featured'))}">
      <span class="nm">${r.featured ? '⭐ ' : ''}${esc(r.term)}</span>
      <label class="mut"><input type="checkbox" ${r.visual ? 'checked' : ''} data-vis="${r.id ?? r.idx}"> ${t('dlg.visual')}</label>
      <button type="button" class="x" data-rm="${r.id ?? r.idx}" title="${esc(t('dlg.remove'))}" aria-label="${esc(t('dlg.remove'))}">✕</button>
    </div>`).join('');
}
async function dlgAddFromInput() {
  const v = $('#dlgNew').value.trim(); if (!v) return;
  if (D.mode === 'create') { D.rows.push({ term: v, visual: false }); $('#dlgNew').value = ''; renderDlgRows(); }
  else { await api(`/composers/${S.selected}/aliases`, 'POST', { alias: v, visual: false }); $('#dlgNew').value = ''; await refresh(); renderDlgRows(); }
}
$('#dlgAdd').onclick = dlgAddFromInput;
$('#dlgNew').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); dlgAddFromInput(); } };
$('#dlgCancel').onclick = () => dlg.close();
$('#dlgRows').addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.feat !== undefined) {
    if (D.mode === 'create') D.featured = +el.dataset.feat; else await api(`/composers/${S.selected}/featured`, 'POST', { term_id: +el.dataset.feat });
  } else if (el.dataset.vis !== undefined) {
    if (D.mode === 'create') D.rows[+el.dataset.vis].visual = el.checked; else await api(`/aliases/${el.dataset.vis}`, 'PATCH', { visual: el.checked });
  }
  if (D.mode === 'edit') await refresh();
  renderDlgRows();
});
$('#dlgRows').addEventListener('click', async e => {
  const b = e.target.closest('[data-rm]'); if (!b) return;
  if (D.mode === 'create') { const i = +b.dataset.rm; D.rows.splice(i, 1); if (D.featured >= D.rows.length) D.featured = 0; else if (i < D.featured) D.featured--; }
  else { try { await api('/aliases/' + b.dataset.rm, 'DELETE'); } catch { return; } await refresh(); }
  renderDlgRows();
});
$('#dlgForm').addEventListener('submit', async e => {
  e.preventDefault();
  await dlgAddFromInput(); // texto pendente no campo entra na lista
  if (D.mode === 'edit') { dlg.close(); return; }
  if (!D.rows.length) { $('#dlgNew').focus(); return; }
  try {
    const r = await api('/composers', 'POST', { name: D.rows[D.featured].term, terms: D.rows.map(x => ({ term: x.term, visual: x.visual })) });
    dlg.close(); await refresh(); select(r.id);
  } catch { /* api() já mostrou o erro e o popup continua aberto */ }
});
$('#addBtn').onclick = () => openDialog('create');

/* ---------------- ações do cabeçalho ---------------- */
async function act(path, key) { try { await api(path, 'POST'); toast(t(key)); refresh(); } catch {} }
$('#scanAll').onclick = () => act('/scan', 'toast.scan');
$('#resumeAll').onclick = () => act('/scan', 'toast.resume');
$('#reloadAll').onclick = () => { if (confirm(t('confirm.reload.all'))) act('/scan?full=1', 'toast.reload'); };
$('#lang').onchange = e => {
  lang = e.target.value; try { localStorage.setItem('lang', lang); } catch {}
  applyI18n(); updateNotifBtn(); S.detailSig = null; connSig = ''; renderList(); if (sel()) buildDetail();
  if (S.view === 'new') loadNew(); if (S.view === 'hist') loadHist(); if (S.view === 'set') loadSettings();
};

/* ---------------- configurações ---------------- */
async function loadSettings() {
  const s = await api('/settings'); S.intervalHours = s.interval_hours;
  $('#setInterval').value = s.interval_hours; $('#setDelay').value = s.delay_ms; $('#setDesktop').checked = s.desktop;
  const mark = (id, on) => { const el = $(id); el.value = ''; el.placeholder = on ? t('set.configured') : el.dataset.ph || el.placeholder; };
  for (const id of ['#setDiscord', '#setTgToken', '#setNtfy', '#setWebhook']) { const el = $(id); if (!el.dataset.ph) el.dataset.ph = el.placeholder; }
  mark('#setDiscord', s.discord); mark('#setTgToken', s.telegram); mark('#setNtfy', s.ntfy); mark('#setWebhook', s.webhook);
  $('#setTgChat').value = ''; $('#setTgChat').placeholder = s.telegram ? t('set.configured') : '';
}
$('#setSave').onclick = async () => {
  const body = { interval_hours: +$('#setInterval').value || 24, delay_ms: +$('#setDelay').value || 1200, desktop: $('#setDesktop').checked };
  for (const [id, key] of [['#setDiscord', 'discord'], ['#setTgToken', 'telegram_token'], ['#setTgChat', 'telegram_chat'], ['#setNtfy', 'ntfy'], ['#setWebhook', 'webhook']]) { const v = $(id).value.trim(); if (v) body[key] = v; }
  try { await api('/settings', 'PUT', body); toast(t('set.saved')); await loadSettings(); } catch {}
};
document.querySelectorAll('[data-clear]').forEach(b => b.onclick = async () => {
  const k = b.dataset.clear; const body = k === 'telegram' ? { telegram_token: null, telegram_chat: null } : { [k]: null };
  await api('/settings', 'PUT', body); toast(t('set.saved')); loadSettings();
});
$('#setTest').onclick = async () => {
  const r = await api('/notify/test', 'POST');
  $('#setStatus').textContent = !r.sent.length && !r.failed.length ? t('set.test.none')
    : [r.sent.length ? t('set.test.ok', r.sent.join(', ')) : '', r.failed.length ? t('set.test.fail', r.failed.map(f => `${f.channel} (${f.error})`).join(', ')) : ''].filter(Boolean).join(' · ');
};

/* ---------------- atualização: SSE (sem recarregar a página nem apagar o que se digita) ---------------- */
let refreshing = false, again = false;
async function refresh() {
  if (refreshing) { again = true; return; }
  refreshing = true;
  try {
    S.composers = await api('/composers');
    if (S.selected && !sel()) { S.selected = null; buildDetail(); }
    renderList();
    await loadNew();
    if (sel() && $('#dHead')) { renderHead(); loadSongs(); loadConnections(); }
    if (S.view === 'hist') loadHist();
  } catch {} finally { refreshing = false; if (again) { again = false; refresh(); } }
}
let evTimer = null;
function connectEvents() {
  const es = new EventSource('/api/events');
  es.onmessage = () => { if (!evTimer) evTimer = setTimeout(() => { evTimer = null; refresh(); }, 300); };
}

applyTheme(); applyI18n(); updateNotifBtn();
api('/settings').then(s => { S.intervalHours = s.interval_hours; }).catch(() => {});
refresh(); connectEvents();
setInterval(refresh, 30000); // reserva caso o SSE caia
</script>
</body>
</html>
